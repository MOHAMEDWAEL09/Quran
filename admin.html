<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>منشئ قائمة الشيوخ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9eb;--ink:#1a1a1c;--mut:#8a8a90;--acc:#ff7a00;--bad:#c4411f;--ok:#4f7a32;
--out:8px 8px 18px rgba(0,0,0,.13),-8px -8px 18px rgba(255,255,255,.95);
--sm:4px 4px 10px rgba(0,0,0,.12),-4px -4px 10px rgba(255,255,255,.9);
--in:inset 4px 4px 9px rgba(0,0,0,.14),inset -4px -4px 9px rgba(255,255,255,.9);--bd:rgba(0,0,0,.25);color-scheme:light}
@media (prefers-color-scheme:dark) and (max-width:1023.98px){:root{--bg:#2b302d;--ink:#e9ebe7;--mut:#8f9893;--bad:#e8553a;--ok:#9bbf7a;
--out:8px 8px 18px rgba(0,0,0,.45),-6px -6px 16px rgba(255,255,255,.035);
--sm:4px 4px 10px rgba(0,0,0,.42),-3px -3px 9px rgba(255,255,255,.035);
--in:inset 4px 4px 9px rgba(0,0,0,.5),inset -3px -3px 8px rgba(255,255,255,.04);--bd:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px 120px}
button{font:inherit;color:inherit;border:0;background:var(--bg);box-shadow:var(--sm);border-radius:999px;cursor:pointer;padding:10px 18px}
button:active,button.on{box-shadow:var(--in)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:20px;margin:18px 4px 4px}h3{margin:0;font-size:16px}
.mu{color:var(--mut);font-size:13px}.c{text-align:center}
.card{background:var(--bg);box-shadow:var(--out);border-radius:24px;padding:14px 16px;margin-bottom:14px}
.inp{width:100%;border:0;border-radius:999px;padding:13px 20px;background:var(--bg);box-shadow:var(--in);font:inherit;color:var(--ink);outline:0;margin:0 0 12px}
.inp.ltr{direction:ltr;text-align:left}
textarea.inp{border-radius:20px;min-height:110px;resize:vertical;line-height:1.7;font-size:13px;white-space:pre}
.cnt{font-size:12px;color:var(--mut);margin:-6px 6px 10px}
.rssp{padding:12px;margin:0 0 12px;border-radius:20px;box-shadow:var(--in)}
.lb{display:block;margin:10px 6px 6px;font-size:13px;color:var(--mut)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.bar button{flex:1;min-width:120px}
.acc{color:var(--acc)}
.seg{display:flex;gap:8px;margin:14px 0}.seg button{flex:1;min-width:0;padding:10px 4px;font-size:13.5px;line-height:1.35}
.rowc{display:flex;align-items:center;gap:8px}.rowc b{flex:1;min-width:0;font-weight:600}
.rowc small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ib{width:38px;height:38px;padding:0;display:grid;place-items:center;flex:none;font-size:15px}
.tg{margin:0 0 12px;padding:12px;border-radius:16px;box-shadow:var(--sm)}.tg b{display:block;margin-bottom:4px}.tg .res{margin:6px 0 0;white-space:pre-line}
.tgl{font-size:13px;color:var(--mut);margin:6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tgl button{padding:6px 12px;font-size:12px}
.tv{margin-top:10px}.tv audio{width:100%;margin-bottom:6px}
.tvr{max-height:340px;overflow:auto;border-radius:14px;box-shadow:var(--in);padding:4px 10px}
.tr{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(128,128,128,.15)}
.tr b{flex:1;min-width:0;font-weight:600;font-size:12.5px}.tr small{color:var(--mut);font-weight:400;display:block;direction:ltr;text-align:right}
.tr button{padding:5px 8px;font-size:11px;box-shadow:var(--sm)}.tr.on{color:var(--acc)}.tr.sus b::after{content:' ⚠';color:var(--bad)}
.mo{padding:12px;margin:0 0 12px;border-radius:20px;box-shadow:var(--in)}
.mo .inp{box-shadow:var(--sm)}
.res{font-size:13px;margin:2px 6px 0;min-height:18px}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.hid{opacity:.5}
#dirty{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));margin:auto;width:calc(100% - 32px);max-width:488px;padding:12px 16px;border-radius:999px;background:var(--bg);box-shadow:var(--out);display:flex;align-items:center;gap:10px;font-size:13px}
#dirty span{flex:1}#dirty[hidden]{display:none}
#toast{position:fixed;left:0;right:0;margin:auto;width:max-content;max-width:calc(100% - 40px);top:calc(env(safe-area-inset-top) + 14px);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
#toast.show{opacity:1}
.vh{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px}.vh .seg button{padding:8px 16px;flex:none}
.vk{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.vk .card{margin:0}.vn{display:block;font-size:30px;font-weight:600;margin-top:4px}
.vbars{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:14px;padding:0 2px}.vbars i{flex:1;min-width:2px;background:linear-gradient(180deg,#ff9a3c,#ff6a00);border-radius:6px 6px 2px 2px}
.vax{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);direction:ltr;margin-top:6px}
.vg{display:grid;gap:14px;grid-template-columns:1fr}.vg .card{margin:0}
.vl{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 2px;font-size:13.5px;border-bottom:1px solid rgba(128,128,128,.13)}.vl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vl b{font-weight:600}
.vl i{position:absolute;right:0;bottom:-1px;height:2px;background:var(--acc);border-radius:2px;opacity:.7}
@media (min-width:1024px){.vg{grid-template-columns:1fr 1fr;gap:18px}.vk{gap:18px}.vn{font-size:36px}#app.wide{max-width:1000px}}
/* ---- phone: new wrappers are invisible, the page looks exactly as before ---- */
.brand,.stats,.seg i,.sidenote{display:none}
/* ---- laptop: dashboard layout (light theme only) ---- */
@media (min-width:1024px){
 html{background:radial-gradient(900px 520px at 88% -6%,rgba(255,122,0,.14),transparent 62%),radial-gradient(760px 520px at 4% 104%,rgba(255,122,0,.09),transparent 62%),var(--bg) fixed}
 body{background:transparent;max-width:1440px;padding:28px 32px 90px}
 .shell{display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:28px;row-gap:22px;align-items:start}
 .side{grid-column:1;grid-row:1/5;position:sticky;top:28px;height:calc(100vh - 56px);display:flex;flex-direction:column;gap:6px;padding:22px 16px;border-radius:30px;background:var(--bg);box-shadow:var(--out)}
 .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 20px;margin-bottom:6px;border-bottom:1px solid rgba(0,0,0,.07)}
 .brand .lg{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#ff9a3c,#ff6a00);display:grid;place-items:center;color:#fff;box-shadow:var(--sm);flex:none}
 .brand b{display:block;font-size:16px;font-weight:600;line-height:1.3}.brand small{color:var(--mut);font-size:12px}
 .side .seg{flex-direction:column;margin:6px 0 0;gap:10px}
 .side .seg button{flex:none;display:flex;align-items:center;justify-content:flex-start;gap:13px;border-radius:18px;padding:13px 16px;text-align:right;font-size:15px}
 .side .seg button i{display:grid;place-items:center;width:22px;height:22px;flex:none;color:var(--mut)}
 .side .seg button.on{background:linear-gradient(135deg,rgba(255,122,0,.17),rgba(255,122,0,.05)),var(--bg);color:var(--acc);font-weight:600}
 .side .seg button.on i{color:var(--acc)}
 .hi{grid-column:2;grid-row:1}.hi h1{font-size:26px;margin:2px 4px 4px}

 #actions{grid-column:2;grid-row:2;margin:0;justify-self:start;flex-wrap:nowrap}
 #actions button{flex:none;min-width:0;white-space:nowrap}
 .sidenote{display:block;margin-top:auto;padding:14px 16px;border-radius:20px;box-shadow:var(--in);font-size:12.5px;line-height:1.8;color:var(--mut)}
 .sidenote b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
 .stats[hidden]{display:none}
 .stats{grid-column:2;grid-row:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
 .sc{display:flex;align-items:center;gap:15px;padding:18px 20px;border-radius:26px;background:var(--bg);box-shadow:var(--out)}
 .sc .ic{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#ff9a3c,#ff6a00);box-shadow:var(--sm)}
 .sc div{min-width:0}.sc span{display:block;color:var(--mut);font-size:13px}
 .sc b{display:block;font-size:28px;font-weight:600;line-height:1.15;margin:2px 0 1px}
 .sc small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #app{grid-column:2;grid-row:4;min-width:0}
 #app.one{max-width:900px}
 #app.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
 #app.grid>.card{margin:0}
 #app.grid>#add{width:auto!important;justify-self:start;padding:12px 30px;margin:0!important;grid-column:1/-1}
 #app.grid>p{grid-column:1/-1}
 .card{border-radius:28px;padding:18px 20px}
 #dirty{max-width:440px;transform:translateX(-148px)}
}
@media (min-width:1200px){
 .hi{margin-inline-end:470px}
 #actions{grid-row:1;justify-self:end;align-self:center}
 .stats{grid-row:2;grid-template-columns:repeat(4,minmax(0,1fr))}
 .shell{grid-template-rows:auto auto 1fr}
 .side{grid-row:1/4}
 #app{grid-row:3}
}
</style>
</head>
<body>
<div class="shell">
<div class="hi"><h1>منشئ قائمة الشيوخ</h1>
<p class="mu" style="margin:0 4px 6px">بتجهّز ملف <b>reciters.json</b> للتطبيق: تضيف شيوخك، وتخفي من قراء mp3quran، وتختار القارئ الافتراضي.</p></div>

<div class="bar" id="actions">
 <button id="imp">استيراد ملف</button>
 <button id="dl" class="acc">تحميل reciters.json</button>
 <button id="cp">نسخ المحتوى</button>
</div>
<input type="file" id="fi" accept=".json,application/json" hidden>

<aside class="side">
 <div class="brand"><span class="lg"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5.2 8 4.7 4 4.7v13c4 0 6.3.5 8 1.8 1.7-1.3 4-1.8 8-1.8v-13c-4 0-6.3.5-8 1.8z"/><path d="M12 6.5v13"/></svg></span><div><b>القرآن الكريم</b><small>لوحة التحكم</small></div></div>
 <div class="seg"><button id="t1" class="on"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 14z"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v3.5"/></svg></i><span>شيوخي</span></button><button id="t2"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.4-3.3 2.6-5 5.5-5s5.1 1.7 5.5 5M16 5.2a3.2 3.2 0 0 1 0 5.6M18.5 14.3c1.5.7 2.6 2.2 3 4.7"/></svg></i><span>قراء mp3quran</span></button><button id="t3"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/></svg></i><span>الإذاعة</span></button><button id="t4"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></i><span>الزوار</span></button></div>
 <div class="sidenote"><b>بعد أي تعديل</b>نزّل <span dir="ltr">reciters.json</span> وارفعه على GitHub مكان القديم.</div>
</aside>

<div class="stats" id="stats"></div>
<div id="app"></div>
</div>

<div id="dirty" hidden><span>فيه تعديلات لسه ما اتنزلتش</span><button id="dl2" class="acc">تحميل</button></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=t=>String(t).replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3000)};
const ar2en=t=>String(t).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
/* same rules as the app: blank = all 114; "1-10,18" ranges; returns sorted list or null if the text is invalid */
function expand(t){t=ar2en(t).trim();if(!t)t='1-114';const o=new Set();for(const p of t.split(/[,،\s]+/).filter(Boolean)){const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;const a=+m[1],b=m[2]?+m[2]:a;if(a<1||b>114||a>b)return null;for(let i=a;i<=b;i++)o.add(i)}return o.size?[...o].sort((x,y)=>x-y):null}
const pad=n=>String(n).padStart(3,'0');
const srv=u=>String(u).trim().replace(/\/*$/,'/');
/* one link per surah (e.g. Catbox): "https://…mp3" lines go in order from surah 1, or write "surah-number link" to jump */
function parseLinks(t){const f={};let n=0,ln=0;for(const raw of ar2en(t).split(/\r?\n/)){ln++;const l=raw.trim();if(!l)continue;
 const m=l.match(/^(?:(\d{1,3})[\s,.:=|)\-]+)?(https:\/\/\S+)$/);if(!m)return{err:'السطر '+ln+' مش رابط https صحيح'};
 n=m[1]?+m[1]:n+1;if(n<1||n>114)return{err:'السطر '+ln+': رقم السورة لازم بين 1 و114'};if(f[n])return{err:'السورة '+n+' مكررة (السطر '+ln+')'};f[n]=m[2]}
 return Object.keys(f).length?{files:f}:{err:''}}
/* RSS import: match each episode to a surah by its title (name, or number), falling back to the number in the file name */
const SN=['الفاتحة|فاتحة الكتاب','البقرة','آل عمران|ال عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة|براءة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء|بني إسرائيل','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر|المؤمن','فصلت|حم السجدة','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان|الدهر','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد|اللهب','الإخلاص','الفلق','الناس'];
const tk=t=>nz(ar2en(t)).replace(/[^؀-ۿ0-9]+/g,' ').trim().split(/\s+/).filter(Boolean);
const SA=SN.map((x,i)=>x.split('|').map(a=>({n:i+1,t:tk(a)})));
function surahOf(title,url){
 const T=tk(title),si=T.indexOf('سوره');let best=null;
 for(const al of SA.flat()){const L=al.t.length;
  for(let i=0;i+L<=T.length;i++){if(al.t.every((w,j)=>T[i+j]===w)){
   if(i>0&&T[i-1]==='عبد')continue;
   const after=si>=0&&i<=si+3&&i>si;
   if((al.t.join('').length<=2||al.n===47)&&!after)continue;
   const sc=(after?100:0)+al.t.join('').length*2-i*0.01;
   if(!best||sc>best.sc)best={n:al.n,sc}}}}
 if(best)return best.n;
 const nm=T.map(Number).find(x=>x>=1&&x<=114&&Number.isInteger(x));if(nm)return nm;
 const f=String(url).split('?')[0].split('/').pop().replace(/\.[a-z0-9]{2,4}$/i,'').match(/(\d{1,3})\D*$/);if(f&&+f[1]>=1&&+f[1]<=114)return +f[1];
 return 0}
function rssItems(x){const out=[];
 try{const d=new DOMParser().parseFromString(x,'text/xml');if(!d.querySelector('parsererror')){d.querySelectorAll('item').forEach(it=>{const t=(it.querySelector('title')||{}).textContent||'';let u='';const en=it.querySelector('enclosure');if(en)u=en.getAttribute('url')||'';if(!u){const mc=it.getElementsByTagName('media:content')[0];if(mc)u=mc.getAttribute('url')||''}if(!u){const l=it.querySelector('link');if(l)u=l.textContent.trim()}out.push({t:t.trim(),u:u.trim()})});if(out.length)return out}}catch(e){}
 const re=/<item[\s\S]*?<\/item>/gi;for(const m of x.match(re)||[]){const t=(m.match(/<title[^>]*>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/i)||[])[1]||'',u=(m.match(/<enclosure[^>]*\burl=["']([^"']+)["']/i)||[])[1]||'';out.push({t:t.trim(),u:u.trim()})}
 return out}
const W2RE=/^https?:\/\/(?:www\.)?way2quran\.com\/api\/podcast\/listen\/([^\/?#]+)\/([^\/?#]+)\/(\d{1,3})\.mp3(?:[?#].*)?$/i;
/* does the browser manage to load this audio file? (works across sites, no CORS needed) */
const probe=u=>new Promise(r=>{const a=new Audio();let d=false;const f=v=>{if(!d){d=true;a.removeAttribute('src');r(v)}};a.preload='metadata';a.onloadedmetadata=()=>f(true);a.oncanplay=()=>f(true);a.onerror=()=>f(false);setTimeout(()=>f(false),8000);a.src=u});
async function rssConvert(k){const x=$('#rsx'+k).value,res=$('#rsr'+k);const set=(t,c)=>{res.textContent=t;res.className='res '+(c||'')};
 if(!x.trim()){set('الصق محتوى الملف الأول','no');return}
 const it=rssItems(x);if(!it.length){set('مفيش عناصر (item) في الملف ده. تأكد إنك نسخت الملف كله.','no');return}
 let w2pad=true,w2note='';

function drawRadio(){
 const L=D.radios||RDEF;
 $('#app').innerHTML=`<div class="card"><h3>الإذاعات (بث مباشر)</h3><p class="mu" style="margin:6px 0 0">دي الإذاعات اللي بتظهر في التطبيق (فوقها بتتضاف تلقائيًا إذاعات القراء من mp3quran). أضف إذاعة من أي دولة بالاسم والدولة ورابط البث https. لو إذاعة وقفت امسحها أو غيّر رابطها.</p></div>`+L.map((x,i)=>`<div class="card" data-i="${i}"><label class="lb" style="margin-top:0">الاسم</label><input class="inp" data-rx="name" value="${E(x.name)}"><label class="lb">الدولة</label><input class="inp" data-rx="country" value="${E(x.country||'')}"><label class="lb">رابط البث (https)</label><input class="inp ltr" data-rx="url" value="${E(x.url)}"><div class="bar" style="margin:0"><button data-a="rtest" data-i="${i}">تجربة</button><button data-a="rdel" data-i="${i}">حذف</button></div><div class="res"></div></div>`).join('')+`<button data-a="radd" style="width:100%;margin-bottom:12px">+ إضافة إذاعة</button><div class="bar"><button class="acc" data-a="rsave">حفظ</button><button data-a="rdef">رجوع للقائمة الافتراضية</button></div>`}
function rRead(){const L=[];document.querySelectorAll('#app [data-i]').forEach(c=>{if(!c.querySelector('[data-rx=url]'))return;L.push({name:c.querySelector('[data-rx=name]').value.trim(),country:c.querySelector('[data-rx=country]').value.trim(),url:c.querySelector('[data-rx=url]').value.trim()})});return L}
function save(){
 readForm();const name=edit.name.trim();if(!name){toast('اكتب اسم الشيخ');return}
 const ms=[];for(const m of edit.ms){
  if(m.links&&m.links.trim()){const r=parseLinks(m.links);if(!r.files){toast(r.err||'اكتب الروابط');return}ms.push(vt({id:m.id,name:m.name.trim()||'مرتل',files:r.files},m));continue}
  const s=srv(m.server);if(!/^https:\/\/[^\s]+$/i.test(s)){toast('اكتب روابط السور أو رابط مجلد لـ «'+(m.name||'الرواية')+'»');return}
  if(!expand(m.surahs)){toast('صيغة السور غير صحيحة');return}ms.push(vt({id:m.id,name:m.name.trim()||'مرتل',server:s,surahs:m.surahs.trim()?ar2en(m.surahs).trim():'1-114'},m))}
 const rid=edit.id||D.next++;ms.forEach(m=>{if(!m.id)m.id=D.next++});
 if(edit.id){const r=D.reciters.find(x=>x.id===edit.id);r.name=name;r.moshaf=ms}else D.reciters.push({id:rid,name,moshaf:ms});
 edit=null;mark();draw();toast('تم الحفظ — فاضل تنزّل الملف وترفعه')}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
 if(t.id==='t1'){tab=1;draw();return}if(t.id==='t2'){tab=2;edit=null;em=0;draw();return}if(t.id==='t3'){tab=3;edit=null;draw();return}
 if(t.id==='t4'){tab=4;edit=null;em=0;draw();if(VC().t&&!vd&&vs!=='loading')loadVis();return}
 if(a==='vsave'){const c={t:$('#vct').value.trim(),p:$('#vcp').value.trim(),m:$('#vcm').value.trim()};if(!c.t||!c.p){toast('اكتب الـ Token ورقم المشروع');return}try{localStorage.setItem('adm-vc',JSON.stringify(c))}catch(x){toast('المتصفح مش بيسمح بحفظ الإعدادات');return}loadVis();return}
 if(a==='vclr'){try{localStorage.removeItem('adm-vc')}catch(x){}vd=null;vs='';draw();return}
 if(a==='vref'){loadVis();return}
 if(a==='vr'){vr=+t.dataset.r;loadVis();return}
 if(t.id==='imp'){$('#fi').click();return}
 if(t.id==='dl'||t.id==='dl2'){const b=new Blob([out()],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='reciters.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),2e3);dirty=false;try{localStorage.removeItem('adm-draft')}catch(x){}draw();toast('اترفع الملف؟ ارفعه على GitHub مكان القديم');return}
 if(t.id==='cp'){try{await navigator.clipboard.writeText(out());toast('تم النسخ — الصقه في GitHub')}catch(x){toast('تعذر النسخ، استخدم التحميل')}return}
 if(t.id==='add'){edit={id:0,name:'',ms:[{id:0,name:'مرتل',server:'',surahs:'',links:''}]};draw();return}
 if(t.id==='load'){t.disabled=true;t.textContent='جارٍ التحميل…';try{API=((await(await fetch('https://www.mp3quran.net/api/v3/reciters?language=ar')).json()).reciters||[]).filter(r=>r.moshaf&&r.moshaf.length)}catch(x){toast('تعذر تحميل القائمة — تحقق من الإنترنت')}draw();return}
 if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1,L=D.reciters;[L[i],L[j]]=[L[j],L[i]];mark();draw();return}
 if(a==='df'){const r=D.reciters[i];D.default=D.default===r.id?0:r.id;mark();draw();return}
 if(a==='dfa'){D.default=D.default===i?0:i;mark();listHide();return}
 if(a==='hide'){D.hidden=D.hidden.includes(i)?D.hidden.filter(x=>x!==i):[...D.hidden,i];mark();listHide();return}
 if(a==='ed'){const r=D.reciters[i];edit={id:r.id,name:r.name,ms:r.moshaf.map(m=>({...m,links:filesText(m),server:m.server||'',surahs:m.surahs||''}))};draw();return}
 if(a==='rm'){if(confirm('حذف «'+D.reciters[i].name+'»؟')){const r=D.reciters[i];D.reciters.splice(i,1);if(D.default===r.id)D.default=0;mark();draw()}return}
 if(a==='addm'){readForm();edit.ms.push({id:0,name:'',server:'',surahs:'',links:''});draw();return}
 if(a==='rmm'){readForm();edit.ms.splice(+t.dataset.k,1);draw();return}
 if(a==='test'){test(+t.dataset.k);return}
 if(a==='tgl'){readForm();const m=edit.ms[+t.dataset.k];const r=m.links&&m.links.trim()?parseLinks(m.links):{};if(!r.files){toast('اكتب روابط السور الأول (تحت)');return}tgRun(+t.dataset.k,[],r.files);return}
 if(a==='tgo'){document.querySelector('input[data-tgf="'+t.dataset.k+'"]').click();return}
 if(a==='tgx'){readForm();delete edit.ms[+t.dataset.k].t;draw();return}
 if(a==='tgv'){tgReview(+t.dataset.k,+t.dataset.n);return}
 if(a==='tgq'){const k=+t.dataset.k,s=$('#tgq'+k);t.disabled=true;t.textContent='جارٍ التحميل…';try{(await refList()).sort((x,y)=>x.n.localeCompare(y.n,'ar')).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.n;s.appendChild(o)});t.remove()}catch(x){t.disabled=false;t.textContent='تحميل قراء المرجع';toast('تعذر التحميل — تحقق من الإنترنت')}return}
 if(a==='rss'){const q=$('#rss'+t.dataset.k);q.hidden=!q.hidden;return}
 if(a==='rssfile'){document.querySelector('input[data-rf="'+t.dataset.k+'"]').click();return}
 if(a==='rssgo'){rssConvert(+t.dataset.k);return}
 if(a==='rssfetch'){const k=+t.dataset.k,u=$('#rsu'+k).value.trim(),res=$('#rsr'+k);if(!/^https:\/\//i.test(u)){res.textContent='اكتب رابط يبدأ بـ https://';res.className='res no';return}
  res.textContent='جارٍ الجلب…';res.className='res';try{const r=await fetch(u);$('#rsx'+k).value=await r.text();rssConvert(k)}catch(x){res.textContent='المتصفح منع الجلب من الموقع. افتح الرابط في المتصفح، انسخ المحتوى كله والصقه في الخانة.';res.className='res no'}return}
 if(a==='em'){em=i;draw();scrollTo(0,0);return}
 if(a==='hm'){emRead(false);D.hm=D.hm.includes(i)?D.hm.filter(x=>x!==i):[...D.hm,i];mark();draw();return}
 if(a==='emreset'){delete D.sx[i];delete D.xf[i];D.hm=D.hm.filter(x=>x!==i);mark();draw();return}
 if(a==='rxadd'){if(!emRead(false))return;(D.rx[em]||=[]).push({id:0,name:'',files:{}});draw();return}
 if(a==='rxdel'){if(!emRead(false))return;D.rx[em].splice(i,1);draw();return}
 if(a==='emsave'){if(!emRead(true))return;mark();em=0;draw();toast('تم الحفظ — فاضل تنزّل الملف وترفعه');return}
 if(a==='emback'){em=0;draw();return}
 if(a==='rdef'){D.radios=null;mark();draw();return}
 if(a==='radd'){D.radios=[...rRead(),{name:'',country:'',url:''}];draw();return}
 if(a==='rdel'){const L=rRead();L.splice(i,1);D.radios=L;mark();draw();return}
 if(a==='rsave'){const L=rRead();for(const x of L){if(!x.name||!/^https:\/\/\S+$/.test(x.url)){toast('كل إذاعة لازم اسم ورابط يبدأ بـ https://');return}}D.radios=JSON.stringify(L)===JSON.stringify(RDEF)?null:L;mark();toast('تم الحفظ — فاضل تنزّل الملف وترفعه');return}
 if(a==='rtest'){const c=t.closest('[data-i]'),u=c.querySelector('[data-rx=url]').value.trim(),r=c.querySelector('.res');if(!/^https:\/\//.test(u)){r.textContent='اكتب رابط https';r.className='res no';return}
  if(ra){ra.pause();ra.src=''}ra=new Audio(u);r.textContent='جارٍ التشغيل… لو سمعت الصوت يبقى الرابط شغال';r.className='res';ra.onerror=()=>{r.textContent='الرابط ده مش شغال';r.className='res no'};ra.onplaying=()=>{r.textContent='شغال ✓';r.className='res ok'};ra.play().catch(()=>{});return}
 if(a==='save'){save();return}
 if(a==='cancel'){edit=null;draw();return}
});
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{D=norm(JSON.parse(await f.text()));mark();edit=null;draw();toast('تم الاستيراد: '+D.reciters.length+' شيخ')}catch(x){toast('الملف مش صالح')}};
document.addEventListener('change',async e=>{const t=e.target;if(t.matches&&t.matches('input[data-tgf]')){const k=+t.dataset.tgf;readForm();tgRun(k,[...t.files]);t.value='';return}if(t.matches&&t.matches('input[data-rf]')){const f=t.files[0],k=+t.dataset.rf;t.value='';if(!f)return;$('#rsx'+k).value=await f.text();rssConvert(k)}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('textarea[data-f=links]'))cnt(t)});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
/* when hosted next to the app, start from the live file so nothing is lost */
(async()=>{if(dirty)return draw();try{const r=await fetch('reciters.json',{cache:'no-cache'});if(r.ok){D=norm(await r.json());toast('تم تحميل القائمة الحالية من الموقع')}}catch(e){}draw()})();
</script>
</body>
</html>
