<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القرآن الكريم</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e9eb">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src https: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>(function(){var t;try{t=(JSON.parse(localStorage.getItem("q")||"{}")).th}catch(e){}if(!t)t="light";document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t=="dark"?"#2b302d":"#e9e9eb"})()</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9eb;--ink:#1a1a1c;--mut:#8a8a90;--acc:#ff7a00;
--out:8px 8px 18px rgba(0,0,0,.13),-8px -8px 18px rgba(255,255,255,.95);
--sm:4px 4px 10px rgba(0,0,0,.12),-4px -4px 10px rgba(255,255,255,.9);
--in:inset 4px 4px 9px rgba(0,0,0,.14),inset -4px -4px 9px rgba(255,255,255,.9);
--onbg:#dcdcdf;--fill:#2a2a2d;--track:#d3d3d6;--pix:#161616;--pixd:#9a9a9a;--pixoff:rgba(0,0,0,.05);--colon:#f0c9a8;--bd:rgba(0,0,0,.25);--mn:#e05a00;--hl:rgba(255,122,0,.15);color-scheme:light}
:root[data-theme=dark]{--bg:#2b302d;--ink:#e9ebe7;--mut:#8f9893;--acc:#ff7a00;
--out:8px 8px 18px rgba(0,0,0,.45),-6px -6px 16px rgba(255,255,255,.035);
--sm:4px 4px 10px rgba(0,0,0,.42),-3px -3px 9px rgba(255,255,255,.035);
--in:inset 4px 4px 9px rgba(0,0,0,.5),inset -3px -3px 8px rgba(255,255,255,.04);
--onbg:#222724;--fill:#dfe2de;--track:#1f2421;--pix:#e9ebe7;--pixd:#6f7873;--pixoff:rgba(255,255,255,.04);--colon:#e8553a;--bd:rgba(0,0,0,.55);--mn:#e8553a;--hl:rgba(255,122,0,.2);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px 0}
button{font:inherit;color:inherit;border:0;background:var(--bg);box-shadow:var(--sm);border-radius:999px;cursor:pointer;transition:box-shadow .15s}
button:active,button.on{box-shadow:var(--in)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:20px;margin:20px 4px 14px;display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:24px}
.mu{color:var(--mut);font-size:14px}.c{text-align:center}
.card{background:var(--bg);box-shadow:var(--out);border-radius:28px}
.inp{width:100%;border:0;border-radius:999px;padding:14px 22px;background:var(--bg);box-shadow:var(--in);font:inherit;color:var(--ink);outline:0;margin-bottom:16px}
main{padding-bottom:180px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px;border-radius:24px;cursor:pointer}
.row b{flex:1;font-weight:600}.row small{color:var(--mut);display:block;font-weight:400;font-size:13px}
.row .n{width:38px;height:38px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;font-size:13px;color:var(--mut);flex:none}
.row.cur{box-shadow:var(--in)}.row.cur .n{background:var(--acc);color:#fff;box-shadow:none}
.ib{width:42px;height:42px;display:grid;place-items:center;flex:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.fv.on svg{fill:var(--acc);stroke:var(--acc)}
#ins{padding:8px 16px;font-size:13px}
/* nav + mini */
nav,#mini{position:fixed;left:0;right:0;margin:auto;width:calc(100% - 32px);max-width:488px;z-index:10}
nav{bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:10px;border-radius:999px;background:var(--bg);box-shadow:var(--out)}
nav button{width:54px;height:54px;display:grid;place-items:center;padding:0}
nav button.on{background:var(--onbg)}
#mini{bottom:calc(96px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;background:var(--bg);box-shadow:var(--out)}
#mini .tx{flex:1;min-width:0;cursor:pointer}
#mini .tx b,#mini .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{width:54px;height:54px;flex:none;position:relative}.mv svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(2px 3px 3px rgba(0,0,0,.25))}
.p2{display:none}body.playing .p1{display:none}body.playing .p2{display:block}
/* vinyl */
.vw{position:relative;width:min(68vw,260px);aspect-ratio:1;margin:26px auto 28px;cursor:pointer;border-radius:50%}
.vw svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(8px 12px 14px rgba(0,0,0,.25))}
.disc{transform-origin:100px 100px;animation:sp 5s linear infinite paused}
body.playing .disc{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
.arm{transform-origin:172px 28px;transform:rotate(-45deg);transition:transform .9s cubic-bezier(.4,0,.2,1)}
body.playing .arm{transform:none}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
/* sheets */
.sheet{position:fixed;inset:0;margin:auto;max-width:520px;background:var(--bg);transform:translateY(100%);transition:transform .35s ease;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 22px 28px}
.sheet.open{transform:none}
#pl{display:flex;flex-direction:column}
#pl>*{flex:none}
#ms{z-index:25}
#menu{inset:auto 0 0;max-height:75vh;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:30;padding-top:6px}
#bd{position:fixed;inset:0;background:var(--bd);opacity:0;pointer-events:none;transition:opacity .3s;z-index:29}
#bd.open{opacity:1;pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center}
.tm{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:10px 4px 18px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ctl button{width:50px;height:50px;display:grid;place-items:center;padding:0;font-size:13px}
.ctl2{display:flex;align-items:center;gap:16px}
.ctl2 button{width:50px;height:50px;font-size:22px;flex:none}
.ctl2 .i{flex:none;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;direction:rtl;outline:0;box-shadow:var(--in);background:linear-gradient(to left,var(--fill) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
.hd{display:flex;gap:10px;align-items:center}
.hd .ib{width:40px;height:40px}
#th{color:var(--mn)}
.sec{margin:18px 6px 8px;font-size:14px;color:var(--mut)}
#hc{display:flex;justify-content:space-between;align-items:center}
.sm{font-size:13px;padding:8px 14px}
.rmx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--mut);flex:none}
/* mushaf page: one raised card, inset surah title, standalone basmala, ayah numbers as small inset discs */
#mb{padding:28px 4px 0;text-align:center;font-size:15px;line-height:2;color:var(--mut)}
#ms{padding-left:14px;padding-right:14px}
#mb.pg{margin-top:12px;padding:12px 12px 20px;background:var(--bg);box-shadow:var(--out);border-radius:28px;color:var(--ink);text-align:start;font-family:'Amiri Quran',serif;font-size:inherit;line-height:inherit}
.sh{display:flex;flex-direction:column;align-items:center;padding:8px 14px;margin:0 0 4px;border-radius:999px;box-shadow:var(--in)}
.sh b{font-size:25px;font-weight:400;line-height:1.8}
.sh small{color:var(--mut);font:400 12px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif}
.bm{text-align:center;font-size:26px;line-height:2.3;margin-top:12px}
.qt{font-size:26px;line-height:2.5;text-align:justify;text-align-last:center;margin-top:2px}
#mb .ay i{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .25em;margin:0 .3em;border-radius:999px;box-shadow:var(--in);font:normal 600 13px/1 'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--acc);vertical-align:middle}
/* tafsir: tap an ayah -> compact bottom panel, text above stays visible */
#mb .ay{border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer;transition:background .2s;scroll-margin:72px 0 46vh}
#mb .ay.sel{background:var(--hl)}
#mh{margin:4px 0 0;font-size:12px}
#ms.tfo::after{content:'';display:block;height:44vh}
#tf{position:fixed;inset:auto 0 0;margin:auto;max-width:520px;max-height:44vh;display:flex;flex-direction:column;padding:14px 22px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);visibility:hidden;transform:translateY(110%);transition:transform .3s ease,visibility 0s .3s}
#ms.tfo #tf{visibility:visible;transform:none;transition:transform .3s ease}
.tfh{display:flex;align-items:center;gap:8px;flex:none}
.tfh b{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfh .ib{width:38px;height:38px}.tfh .sm{flex:none}
#tft{margin:12px 2px 0;overflow:auto;font-size:16px;line-height:2;white-space:pre-line;overscroll-behavior:contain}
button:disabled{opacity:.35;box-shadow:var(--sm);cursor:default}
/* live tafsir window inside the player (only for reciters that have ayah timings) */
#tb:not([hidden]){display:grid;place-items:center;padding:0}#tb .i{color:var(--ink)}#tb.on .i{color:var(--acc)}
.vw{transition:width .3s,margin .3s}
#pl.wo .vw{width:min(30vw,112px);margin:10px auto 12px}
#wn{display:none;margin:2px 0 20px;padding:10px 14px 12px;border-radius:24px;box-shadow:var(--in)}
#pl.wo #wn{display:block}
.wh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.wh .sm{padding:6px 14px;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wh .ib{width:34px;height:34px}
#wt{max-height:132px;overflow:auto;font-size:15px;line-height:1.9;white-space:pre-line;overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.vw{transition:none}}
@media (prefers-reduced-motion:reduce){#tf{transition:none}}
.st{display:flex;gap:6px;padding:16px 10px;margin:0 0 6px;text-align:center}
.st>div{flex:1;min-width:0}.st .tp{flex:1.5}
.st b{display:block;font-size:17px;font-weight:600;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.dlb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;margin:18px 0 6px;font-size:14px}
.dlb.on{color:var(--acc)}
#ds{margin:0 0 14px;font-size:12px}
#toast{position:fixed;left:0;right:0;margin:auto;width:max-content;max-width:calc(100% - 40px);top:calc(env(safe-area-inset-top) + 16px);z-index:40;padding:10px 18px;border-radius:999px;background:var(--fill);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
 <section class="v" id="v-home">
  <h1><span>القرآن الكريم</span><span class="hd"><button id="ins" class="sm" hidden>تثبيت التطبيق</button><button class="ib" id="th" aria-label="تبديل الثيم"></button></span></h1>
  <div class="card row" id="cr" data-tab="rec" tabindex="0"></div>
  <input class="inp" id="q" placeholder="ابحث عن سورة…" aria-label="بحث">
  <div id="sl"></div>
 </section>
 <section class="v" id="v-rec" hidden>
  <h1>القراء</h1>
  <input class="inp" id="rq" placeholder="ابحث عن قارئ…" aria-label="بحث عن قارئ">
  <div id="rl"></div>
 </section>
 <section class="v" id="v-fav" hidden><div id="fl"></div></section>
 <section class="v" id="v-hist" hidden>
  <h1><span>سجل الاستماع</span><button id="hclr" class="sm" hidden>مسح الكل</button></h1>
  <div class="card st" id="st"></div>
  <div id="hl"></div>
 </section>
</main>

<div id="mini" class="card" hidden>
 <div class="mv"><svg viewBox="0 0 200 200" aria-hidden="true"><g class="disc"><circle cx="100" cy="100" r="98" fill="#85858a"/><g fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3"><circle cx="100" cy="100" r="82"/><circle cx="100" cy="100" r="66"/><circle cx="100" cy="100" r="50"/></g><path d="M100 100V4A96 96 0 0 1 150 17z" fill="#fff" opacity=".2"/><path d="M100 100V196A96 96 0 0 1 50 183z" fill="#fff" opacity=".2"/><circle class="lb" cx="100" cy="100" r="34" fill="#ff7a00"/><circle cx="100" cy="100" r="6" fill="#111"/></g><g class="arm"><path d="M172 28L160 96L140 134" stroke="#cfcfd3" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="127" y="122" width="24" height="32" rx="5" fill="#2b2b2e" transform="rotate(25 140 134)"/><circle cx="172" cy="28" r="20" fill="#dcdce0" stroke="#b0b0b5" stroke-width="3"/><circle cx="172" cy="28" r="7" fill="#8a8a8e"/></g></svg></div>
 <div class="tx"><b class="tt"></b><small class="rr mu"></small></div>
 <button class="ib pp" aria-label="تشغيل / إيقاف"><svg class="i f p1" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><svg class="i f p2" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg></button>
</div>

<nav>
 <button data-tab="home" class="on" data-ic="list" aria-label="السور"></button>
 <button data-tab="rec" data-ic="users" aria-label="القراء"></button>
 <button data-tab="hist" data-ic="clock" aria-label="سجل الاستماع"></button>
 <button data-tab="fav" data-ic="star" aria-label="المفضلة"></button>
 <button data-tab="player" data-ic="disc" aria-label="المشغّل"></button>
</nav>

<section class="sheet" id="pl">
 <div class="top"><button class="ib" data-close="pl" data-ic="x" aria-label="إغلاق"></button><span class="mu">يُشغَّل الآن</span><button class="ib fv" id="fv" data-ic="star" aria-label="مفضلة"></button></div>
 <div class="vw" id="vw" role="button" aria-label="تشغيل / إيقاف">
  <svg viewBox="0 0 200 200">
   <defs><radialGradient id="g"><stop offset=".3" stop-color="#9c9ca0"/><stop offset="1" stop-color="#7d7d82"/></radialGradient></defs>
   <g class="disc">
    <circle cx="100" cy="100" r="98" fill="url(#g)"/>
    <g fill="none" stroke="#000" stroke-opacity=".13"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="42"/></g>
    <path d="M100 100V4A96 96 0 0 1 150 17z" fill="#fff" opacity=".16"/><path d="M100 100V196A96 96 0 0 1 50 183z" fill="#fff" opacity=".16"/>
    <circle class="lb" cx="100" cy="100" r="32" fill="#ff7a00" stroke="#e05a00" stroke-width="2"/>
    <text id="dn" x="100" y="110" text-anchor="middle" font-size="30" font-weight="700" fill="#fff"></text>
   </g>
   <g class="arm"><path d="M172 28L160 96L140 134" stroke="#cfcfd3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="126" width="18" height="26" rx="4" fill="#2b2b2e" transform="rotate(25 140 134)"/><circle cx="172" cy="28" r="14" fill="#dcdce0" stroke="#b9b9be" stroke-width="2"/><circle cx="172" cy="28" r="5" fill="#8a8a8e"/></g>
  </svg>
 </div>
 <h2 class="tt c"></h2><p class="rr mu c"></p>
 <div id="wn" role="region" aria-label="تفسير الآية الحالية"><div class="wh"><button class="sm" id="wl" aria-label="خيارات التفسير"></button><button class="ib" data-wx data-ic="x" aria-label="إغلاق التفسير"></button></div><div id="wt"></div></div>
 <input type="range" id="sk" value="0" min="0" step="any" aria-label="التقدم">
 <div class="tm"><span id="t1">0:00</span><span id="t2">-0:00</span></div>
 <div class="ctl">
  <button id="sb" data-ic="moon" aria-label="مؤقت النوم"></button>
  <button id="pv" data-ic="prev" aria-label="السورة السابقة"></button>
  <button id="bk" aria-label="رجوع 10 ثوانٍ">−10</button>
  <button id="fw" aria-label="تقديم 10 ثوانٍ">+10</button>
  <button id="nx" data-ic="next" aria-label="السورة التالية"></button>
  <button id="spb">×1</button>
 </div>
 <div class="ctl2"><button id="mb2" aria-label="نص السورة">ق</button><button id="tb" data-ic="msg" aria-label="تفسير الآية الحالية" hidden></button><span data-ic="vol" class="i2"></span><input type="range" id="vo" min="0" max="1" step=".01" aria-label="الصوت"></div>
 <button class="dlb" id="dl"></button>
 <p class="mu c" id="ds"></p>
</section>

<section class="sheet" id="ms"><div class="top"><button class="ib" data-close="ms" data-ic="x" aria-label="إغلاق"></button><span class="mu">المصحف</span><span class="ib"></span></div><p class="mu c" id="mh" hidden>اضغط على أي آية لعرض تفسيرها</p><div id="mb"></div>
 <div id="tf" role="region" aria-label="تفسير الآية">
  <div class="tfh"><button class="ib" data-tfx data-ic="x" aria-label="إغلاق التفسير"></button><b id="tfl"></b><button class="sm" id="tfe" aria-label="اختيار التفسير"></button><button class="ib" id="tfp" data-ic="cr" aria-label="الآية السابقة"></button><button class="ib" id="tfn" data-ic="cl" aria-label="الآية التالية"></button></div>
  <div id="tft"></div>
 </div>
</section>
<div id="toast" role="status"></div><div id="bd"></div><section class="sheet" id="menu"></section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

 S.r=cur.r.id;S.m=cur.m.id;

 const start=src=>{if(tok!==ptok)return;if(src.startsWith('about:')){toast('رابط الصوت غير آمن أو غير صالح');return}const old=blobU;blobU=src.startsWith('blob:')?src:null;a.src=src;if(old)URL.revokeObjectURL(old);a.play().catch(()=>{})};

async function dlStart(k,u){
 if(!window.caches){toast('المتصفح لا يدعم التنزيل');return}
 if(DJ){toast('يوجد تنزيل جارٍ بالفعل');return}
 const ctl=new AbortController();DJ={k,ctl,txt:'0%'};dlUI();
 try{
  const res=await fetch(u,{signal:ctl.signal});
  if(!res.ok||!res.body)throw 0;
  const tot=+res.headers.get('content-length')||0;
  if(tot&&navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota&&tot>e.quota-e.usage)throw'space'}
  try{navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let got=0,lp='';
  const ts=new TransformStream({transform(c,o){got+=c.length;const p=tot?(got/tot*100|0)+'%':mb(got);if(p!==lp){lp=p;if(DJ){DJ.txt=p;dlUI()}}o.enqueue(c)}});
  const c=await caches.open(AUD);
  await c.put(u,new Response(res.body.pipeThrough(ts),{headers:{'Content-Type':'audio/mpeg'}}));
  S.dl[k]={u,s:got,t:Date.now()};save();
  if(WR&&key()===k){const sn=+k.split('|')[2];tmGet(WR,sn).catch(()=>{});tfGet(S.tf,sn).catch(()=>{})} // so the live tafsir also works offline for this surah

 }catch(e){
  if(window.caches)caches.open(AUD).then(c=>c.delete(u)).catch(()=>{});
  toast(ctl.signal.aborted?'تم إلغاء التنزيل':(e==='space'||(e&&e.name==='QuotaExceededError'))?'المساحة المتاحة على الجهاز لا تكفي':'تعذر التنزيل — تحقق من الإنترنت')}
 DJ=null;dlUI();if(tab==='fav')render();updStorage()}

document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let t;
 if(t=g('[data-mi]')){const f=MI[t.dataset.mi];closeL(f);return}
 if(g('#bd')){closeL();return}
 if(t=g('.ay')){if(String(getSelection()))return;const a=+t.dataset.a;msA===a?tfClose():tfShow(a);return}
 if(g('#tb')){wnOn?wnClose():wnOpen();return}
 if(g('[data-wx]')){wnClose();return}
 if(g('#wl')){menu('التفسير',[...TFE.map(x=>[x[2],()=>{S.tf=x[0];save();wnKey='';wnLabel();if(wnPin)wnShow(wnN,wnA);else wnSync()}]),[wnPin?'متابعة التلاوة تلقائيًا':'تثبيت هذه الآية',()=>{wnPin=!wnPin;wnLabel();if(!wnPin){wnKey='';wnSync()}}]]);return}
 if(g('[data-tfx]')){tfClose();return}
 if(g('#tfp')){if(msA>1)tfShow(msA-1);return}
 if(g('#tfn')){if(msA&&msA<msC)tfShow(msA+1);return}
 if(g('#tfe')){menu('التفسير',TFE.map(x=>[x[2],()=>{S.tf=x[0];save();if(msA)tfShow(msA)}]));return}
 if(g('#hclr')){menu('مسح سجل الاستماع؟',[['نعم، امسح الكل',()=>{S.hs=[];save();render()}],['إلغاء',()=>{}]]);return}
 if(g('#dlall')){menu('حذف كل التنزيلات؟',[['نعم، احذف الكل',()=>{Object.keys(S.dl).forEach(dlDel);render();dlUI();updStorage()}],['إلغاء',()=>{}]]);return}
 if(t=g('[data-dlrm]')){dlDel(t.dataset.dlrm);render();dlUI();updStorage();return}
 if(t=g('[data-dl]')){const[r,m,n]=t.dataset.dl.split('|'),x=R.find(y=>y.id==r);if(x){setReciter(x,m);play(+n)}else toast('تعذر تحميل بيانات القارئ — تحقق من الإنترنت');return}
 if(g('#dl')){dlBtn();return}
 if(t=g('[data-hrm]')){S.hs=S.hs.filter(x=>x.k!==t.dataset.hrm);save();render();return}
 if(t=g('[data-hs]')){const[r,m,n]=t.dataset.hs.split('|'),x=R.find(y=>y.id==r);if(x){setReciter(x,m);play(+n)}else toast('تعذر تحميل بيانات القارئ — تحقق من الإنترنت');return}
 if(t=g('[data-fr]')){const i=+t.dataset.fr;S.fr=S.fr.includes(i)?S.fr.filter(x=>x!=i):[...S.fr,i];save();render();return}
 if(t=g('[data-ftrm]')){S.ft=S.ft.filter(x=>x!=t.dataset.ftrm);save();ui();return}
 if(t=g('[data-ft]')){const[r,m,n]=t.dataset.ft.split('|'),x=R.find(y=>y.id==r);if(x){setReciter(x,m);play(+n)}else toast('تعذر تحميل بيانات القارئ — تحقق من الإنترنت');return}
 if(t=g('[data-r]')){pickR(t.dataset.r);return}
 if(t=g('[data-n]')){play(+t.dataset.n);return}
 if(t=g('[data-tab]')){t.dataset.tab=='player'?openPl():go(t.dataset.tab);return}
 if(g('[data-close]')){closeL();return}
 if(g('#vw')||g('.pp')){tog();return}
 if(g('#mini .tx'))openPl()
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
$('#q').oninput=home;$('#rq').oninput=rec;

/* audio */
a.onplay=()=>{document.body.classList.add('playing');lc=a.currentTime};
a.onpause=()=>{document.body.classList.remove('playing');lc=null;savePos();save();if(newVer)setTimeout(()=>location.reload(),300)};
a.onloadedmetadata=()=>{if(seekTo!=null){if(seekTo<a.duration-5)a.currentTime=seekTo;seekTo=null}lc=a.currentTime;prog()};
a.onseeking=()=>{lc=null};a.onseeked=()=>{lc=a.currentTime};
a.onerror=()=>toast(S.dl[pk]?'تعذر تشغيل الملف المحمّل':'تعذر التشغيل — تحقق من الإنترنت أو نزّل السورة للاستماع بدون نت');
addEventListener('visibilitychange',()=>{if(document.hidden){acc();savePos();save()}});
addEventListener('pagehide',()=>{savePos();save()});
function prog(){const d=isFinite(a.duration)?a.duration:0,c=a.currentTime||0;$('#sk').max=d;$('#sk').value=c;$('#sk').style.setProperty('--p',d?c/d*100+'%':'0%');$('#t1').textContent=fmt(c);$('#t2').textContent='-'+fmt(d-c)}
a.ondurationchange=()=>{prog();if(wnOn)wnSync()};
a.ontimeupdate=()=>{prog();acc();if(wnOn)wnSync();const n=Date.now();if(n-lastSave>3000){lastSave=n;savePos();save();if(tab==='hist'&&$('#st'))$('#st').innerHTML=stHTML()}};
a.onended=()=>{delete S.pos[pk];save();if(slEnd){sleep(0);return}step(1)};
$('#sk').oninput=e=>{a.currentTime=+e.target.value};
$('#vo').oninput=e=>{S.vol=+e.target.value;a.volume=S.vol;e.target.style.setProperty('--p',S.vol*100+'%');save()};
$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
$('#bk').onclick=()=>a.currentTime=Math.max(0,a.currentTime-10);
$('#fw').onclick=()=>a.currentTime=Math.min(a.duration||1e9,a.currentTime+10);
$('#fv').onclick=()=>{if(!cur.m)return;const k=key();S.ft=S.ft.includes(k)?S.ft.filter(x=>x!=k):[...S.ft,k];save();$('#fv').classList.toggle('on',S.ft.includes(k))};
$('#spb').onclick=()=>menu('سرعة التلاوة',[.75,1,1.25,1.5,2].map(v=>['×'+v,()=>{S.sp=v;a.defaultPlaybackRate=a.playbackRate=v;$('#spb').textContent='×'+v;save()}]));

/* sleep timer */
let sl=null,slEnd=false;
function sleep(m){clearTimeout(sl);slEnd=m==='end';$('#sb').classList.toggle('on',!!m);if(typeof m=='number'&&m)sl=setTimeout(fade,m*60000)}
function fade(){let v=a.volume;const i=setInterval(()=>{v-=.05;if(v<=.03){clearInterval(i);a.pause();a.volume=S.vol;sleep(0)}else a.volume=v},250)}
$('#sb').onclick=()=>menu('مؤقت النوم',[['١٥ دقيقة',15],['٣٠ دقيقة',30],['٤٥ دقيقة',45],['ساعة',60],['نهاية السورة','end'],['إيقاف المؤقت',0]].map(x=>[x[0],()=>sleep(x[1])]));

/* mushaf text */
let msN=0,msC=0,msA=0,mTok=0,tfTok=0;const TF={};
$('#mb2').onclick=async()=>{
 if(!HS().ms)push({ms:true});const b=$('#mb'),n=cur.n,tok=++mTok;tfClose();$('#mh').hidden=true;b.className='';b.textContent='جارٍ التحميل…';
 try{const j=await(await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`)).json();if(tok!==mTok)return;
  const d=j.data,ay=d.ayahs.map(x=>({n:x.numberInSurah,t:x.text}));let bm='';
  /* the API glues the basmala to the first ayah of most surahs: show it as its own line (not for al-Fatiha, where it IS ayah 1, nor at-Tawba) */
  if(n!==1&&n!==9&&ay.length){const w=ay[0].t.trim().split(/\s+/);if(w.length>4&&nz(w.slice(0,4).join(' ')).trim().replace(/\s+/g,' ')==='بسم الله الرحمن الرحيم'){bm=w.slice(0,4).join(' ');ay[0].t=w.slice(4).join(' ')}}
  const rv=d.revelationType==='Meccan'?'مكية':d.revelationType==='Medinan'?'مدنية':'',c=ay.length;
  msN=n;msC=c;
  b.className='pg';
  b.innerHTML=`<div class="sh"><b>سورة ${N[n-1]}</b><small>${[rv,c.toLocaleString('ar-EG')+' '+(c<=10?'آيات':'آية')].filter(Boolean).join(' · ')}</small></div>${bm?`<div class="bm">${E(bm)}</div>`:''}<div class="qt">${ay.map(x=>`<span class="ay" data-a="${x.n}">${E(x.t)}<i>${x.n.toLocaleString('ar-EG')}</i></span>`).join(' ')}</div>`;
  $('#mh').hidden=!!S.hn}
 catch(err){if(tok===mTok){b.className='';b.textContent='تعذر تحميل النص. يلزم الإنترنت في أول مرة.'}}};

/* tafsir (alquran.cloud): one request per surah+edition, then cached by the service worker for offline */
const TFE=[['ar.muyassar','الميسّر','التفسير الميسّر'],['ar.jalalayn','الجلالين','تفسير الجلالين']];
if(!TFE.some(x=>x[0]===S.tf))S.tf=TFE[0][0];
function tfGet(ed,n){const k=ed+'|'+n;
 return TF[k]||(TF[k]=fetch(`https://api.alquran.cloud/v1/surah/${n}/${ed}`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const d=Array.isArray(j.data)?j.data[0]:j.data,m={};d.ayahs.forEach(x=>m[x.numberInSurah]=x.text);return m}).catch(e=>{delete TF[k];throw e}))}
async function tfShow(a){
 msA=a;const t=$('#tft'),tok=++tfTok;
 $('#ms').classList.add('tfo');
 $$('#mb .ay.sel').forEach(e=>e.classList.remove('sel'));
 const el=$(`#mb .ay[data-a="${a}"]`);if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
 $('#tfl').textContent='الآية '+a.toLocaleString('ar-EG');
 $('#tfe').textContent=TFE.find(x=>x[0]===S.tf)[1];
 $('#tfp').disabled=a<=1;$('#tfn').disabled=a>=msC;
 if(!S.hn){S.hn=1;save();$('#mh').hidden=true}
 t.textContent='جارٍ التحميل…';t.scrollTop=0;
 try{const m=await tfGet(S.tf,msN);if(tok!==tfTok)return;t.textContent=m[a]||'لا يوجد تفسير لهذه الآية.'}
 catch(e){if(tok!==tfTok)return;t.textContent=navigator.onLine?'تعذر تحميل التفسير. حاول مرة أخرى.':'يلزم الإنترنت لتحميل التفسير في أول مرة.'}}
function tfClose(){tfTok++;msA=0;$('#ms').classList.remove('tfo');$$('#mb .ay.sel').forEach(e=>e.classList.remove('sel'))}

/* live tafsir window: follows the ayah being recited. Only for reciters whose files have mp3quran ayah timings */
let RD=null,WR=0,wnOn=0,wnPin=0,wnA=0,wnN=0,wnKey='';const TM={};
const nu=u=>String(u||'').replace(/^https?:\/\//i,'').replace(/\/+$/,'').toLowerCase();
function readsGet(){return RD||(RD=fetch('https://mp3quran.net/api/v3/ayat_timing/reads').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const l=Array.isArray(j)?j:(j.reads||j.data||[]),m=new Map();l.forEach(x=>{if(x&&x.folder_url&&x.id!=null)m.set(nu(x.folder_url),x.id)});return m}).catch(e=>{RD=null;throw e}))}
async function readFor(m){try{return(await readsGet()).get(nu(m&&m.server))||0}catch(e){return 0}}
function tmGet(rd,n){const k=rd+'|'+n;
 return TM[k]||(TM[k]=fetch(`https://mp3quran.net/api/v3/ayat_timing?surah=${n}&read=${rd}`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const l=(Array.isArray(j)?j:(j.ayat||j.data||[])).map(x=>({a:+x.ayah,s:+x.start_time,e:+x.end_time})).filter(x=>x.a>0&&isFinite(x.s)&&isFinite(x.e)).sort((x,y)=>x.s-y.s);if(!l.length)throw 0;return l}).catch(e=>{delete TM[k];throw e}))}
/* unit is not documented (looks like ms): detect it from the audio length, and refuse timings that don't fit the file */
function tmFactor(l){const d=a.duration;if(!isFinite(d)||d<=0)return 0;const last=l[l.length-1].e,f=last/d>50?1e3:1,r=last/f/d;return(r>1.25||r<.6)?-1:f}
function tmAt(l,f,t){t*=f;let r=0;for(const x of l){if(t>=x.s)r=x.a;else break}return r}
function wnLabel(){
 const ed=TFE.find(x=>x[0]===S.tf)[1];
 $('#wl').textContent=(wnA>0?'الآية '+wnA.toLocaleString('ar-EG'):'بداية السورة')+' · '+ed+(wnPin?' · مثبّتة':'')}
function wnMsg(t){wnKey='';$('#wt').textContent=t;wnLabel()}
async function wnSync(){
 if(!wnOn||!WR||!cur.m)return;
 if(wnPin&&wnN!==cur.n)wnPin=0;
 if(wnPin)return;
 const n=cur.n;let l;
 try{l=await tmGet(WR,n)}catch(e){if(wnOn&&n===cur.n)wnMsg('التفسير المتزامن غير متاح لهذه السورة');return}
 if(!wnOn||n!==cur.n||wnPin)return;
 const f=tmFactor(l);
 if(!f){wnMsg('شغّل السورة ليظهر تفسير الآية');return}
 if(f<0){wnMsg('التوقيت غير متاح لهذه التلاوة');return}
 wnShow(n,tmAt(l,f,a.currentTime))}
function wnShow(n,x){
 const key=`${n}|${x}|${S.tf}`;if(key===wnKey)return;
 wnKey=key;wnA=x;wnN=n;wnLabel();
 const t=$('#wt');t.scrollTop=0;
 if(!x){t.textContent='…';return}
 t.textContent='جارٍ التحميل…';
 tfGet(S.tf,n).then(m=>{if(wnKey===key)t.textContent=m[x]||'لا يوجد تفسير لهذه الآية.'}).catch(()=>{if(wnKey===key){t.textContent=navigator.onLine?'تعذر تحميل التفسير.':'يلزم الإنترنت لتحميل التفسير في أول مرة.';wnKey=''}})}
function wnOpen(){if(!WR)return;wnOn=1;wnPin=0;wnKey='';$('#pl').classList.add('wo');$('#tb').classList.add('on');wnLabel();wnSync()}
function wnClose(){wnOn=0;wnPin=0;wnKey='';$('#pl').classList.remove('wo');$('#tb').classList.remove('on')}
async function tbUpd(){
 const m=cur.m;if(!m)return;const rd=await readFor(m);if(cur.m!==m)return;
 WR=rd;$('#tb').hidden=!rd;if(!rd)wnClose();else if(wnOn)wnSync()}
/* reading the long tafsir text = the person wants it to stay: pin it when they scroll it */
['wheel','touchmove'].forEach(ev=>$('#wt').addEventListener(ev,()=>{const t=$('#wt');if(wnOn&&!wnPin&&wnA>0&&t.scrollHeight>t.clientHeight+2){wnPin=1;wnLabel()}},{passive:true}));

/* media session */
if('mediaSession' in navigator){const m=navigator.mediaSession,h=(k,f)=>{try{m.setActionHandler(k,f)}catch(e){}};
 h('play',()=>a.play());h('pause',()=>a.pause());h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
 h('seekbackward',()=>a.currentTime-=10);h('seekforward',()=>a.currentTime+=10)}

/* install + sw */
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ins').hidden=false});
$('#ins').onclick=()=>{dp&&dp.prompt();$('#ins').hidden=true};
let newVer=false;
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js').then(reg=>{const chk=()=>reg.update().catch(()=>{});addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,36e5)}).catch(()=>{});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;if(a.paused)location.reload();else{newVer=true;toast('يوجد تحديث جديد — سيُطبَّق عند إيقاف التشغيل')}})}

/* boot */
(async()=>{
 try{R=(await(await fetch('https://mp3quran.net/api/v3/reciters?language=ar')).json()).reciters||[]}catch(e){R=[]}
 R=R.filter(r=>r.moshaf&&r.moshaf.length);
 const r=R.find(x=>x.id==S.r)||R.find(x=>x.name.includes('الحصري'))||R[0];
 if(r)setReciter(r,S.m);else rec();
 if(window.caches)caches.open(AUD).then(c=>c.keys()).then(ks=>{const have=new Set(ks.map(q=>q.url));let ch=0;for(const k in S.dl)if(!have.has(S.dl[k].u)){delete S.dl[k];ch=1}if(ch){save();render();dlUI();updStorage()}}).catch(()=>{});
})();
</script>
