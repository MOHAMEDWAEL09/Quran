<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القرآن الكريم</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e9eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9eb;--ink:#1a1a1c;--mut:#8a8a90;--acc:#ff7a00;
--out:8px 8px 18px rgba(0,0,0,.13),-8px -8px 18px rgba(255,255,255,.95);
--sm:4px 4px 10px rgba(0,0,0,.12),-4px -4px 10px rgba(255,255,255,.9);
--in:inset 4px 4px 9px rgba(0,0,0,.14),inset -4px -4px 9px rgba(255,255,255,.9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px 0}
button{font:inherit;color:inherit;border:0;background:var(--bg);box-shadow:var(--sm);border-radius:999px;cursor:pointer;transition:box-shadow .15s}
button:active,button.on{box-shadow:var(--in)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:20px;margin:20px 4px 14px;display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:24px}
.mu{color:var(--mut);font-size:14px}.c{text-align:center}
.card{background:var(--bg);box-shadow:var(--out);border-radius:28px}
.inp{width:100%;border:0;border-radius:999px;padding:14px 22px;background:var(--bg);box-shadow:var(--in);font:inherit;color:var(--ink);outline:0;margin-bottom:16px}
main{padding-bottom:180px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px;border-radius:24px;cursor:pointer}
.row b{flex:1;font-weight:600}.row small{color:var(--mut);display:block;font-weight:400;font-size:13px}
.row .n{width:38px;height:38px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;font-size:13px;color:var(--mut);flex:none}
.row.cur{box-shadow:var(--in)}.row.cur .n{background:var(--acc);color:#fff;box-shadow:none}
.ib{width:42px;height:42px;display:grid;place-items:center;flex:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.fv.on svg{fill:var(--acc);stroke:var(--acc)}
#ins{padding:8px 16px;font-size:13px}
/* nav + mini */
nav,#mini{position:fixed;left:0;right:0;margin:auto;width:calc(100% - 32px);max-width:488px;z-index:10}
nav{bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:10px;border-radius:999px;background:var(--bg);box-shadow:var(--out)}
nav button{width:54px;height:54px;display:grid;place-items:center;padding:0}
nav button.on{background:#dcdcdf}
#mini{bottom:calc(96px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;background:var(--bg);box-shadow:var(--out)}
#mini .tx{flex:1;min-width:0;cursor:pointer}
#mini .tx b,#mini .tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle,#111 0 4%,var(--acc) 5% 24%,#2a2a2c 25% 28%,#8d8d90 29%);box-shadow:var(--sm);animation:sp 5s linear infinite paused}
body.playing .mv{animation-play-state:running}
.p2{display:none}body.playing .p1{display:none}body.playing .p2{display:block}
/* vinyl */
.vw{position:relative;width:min(68vw,260px);aspect-ratio:1;margin:26px auto 28px;cursor:pointer;border-radius:50%}
.vw svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(8px 12px 14px rgba(0,0,0,.25))}
.disc{transform-origin:100px 100px;animation:sp 5s linear infinite paused}
body.playing .disc{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
#arm{transform-origin:172px 28px;transform:rotate(-45deg);transition:transform .9s cubic-bezier(.4,0,.2,1)}
body.playing #arm{transform:none}
@media (prefers-reduced-motion:reduce){.disc,.mv{animation:none}}
/* sheets */
.sheet{position:fixed;inset:0;margin:auto;max-width:520px;background:var(--bg);transform:translateY(100%);transition:transform .35s ease;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 22px 28px}
.sheet.open{transform:none}
#ms{z-index:25}
#menu{inset:auto 0 0;max-height:75vh;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);z-index:30;padding-top:6px}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:29}
#bd.open{opacity:1;pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center}
.tm{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:10px 4px 18px;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ctl button{width:50px;height:50px;display:grid;place-items:center;padding:0;font-size:13px}
.ctl2{display:flex;align-items:center;gap:16px}
.ctl2 button{width:50px;height:50px;font-size:22px;flex:none}
.ctl2 .i{flex:none;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;direction:rtl;outline:0;box-shadow:var(--in);background:linear-gradient(to left,#2a2a2d var(--p,0%),#d3d3d6 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
#mb{font-family:'Amiri Quran',serif;font-size:27px;line-height:2.5;text-align:justify}
#mb i{font-style:normal;color:var(--acc);font-size:20px}
</style>
</head>
<body>
<main>
 <section class="v" id="v-home">
  <h1>القرآن الكريم <button id="ins" hidden>تثبيت التطبيق</button></h1>
  <div class="card row" id="cr" data-tab="rec" tabindex="0"></div>
  <input class="inp" id="q" placeholder="ابحث عن سورة…" aria-label="بحث">
  <div id="sl"></div>
 </section>
 <section class="v" id="v-rec" hidden>
  <h1>القراء</h1>
  <input class="inp" id="rq" placeholder="ابحث عن قارئ…" aria-label="بحث عن قارئ">
  <div id="rl"></div>
 </section>
 <section class="v" id="v-fav" hidden><div id="fl"></div></section>
</main>

<div id="mini" class="card" hidden>
 <div class="mv"></div>
 <div class="tx"><b class="tt"></b><small class="rr mu"></small></div>
 <button class="ib pp" aria-label="تشغيل / إيقاف"><svg class="i f p1" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><svg class="i f p2" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg></button>
</div>

<nav>
 <button data-tab="home" class="on" data-ic="list" aria-label="السور"></button>
 <button data-tab="rec" data-ic="users" aria-label="القراء"></button>
 <button data-tab="fav" data-ic="star" aria-label="المفضلة"></button>
 <button data-tab="player" data-ic="disc" aria-label="المشغّل"></button>
</nav>

<section class="sheet" id="pl">
 <div class="top"><button class="ib" data-close="pl" data-ic="x" aria-label="إغلاق"></button><span class="mu">يُشغَّل الآن</span><button class="ib fv" id="fv" data-ic="star" aria-label="مفضلة"></button></div>
 <div class="vw" id="vw" role="button" aria-label="تشغيل / إيقاف">
  <svg viewBox="0 0 200 200">
   <defs><radialGradient id="g"><stop offset=".3" stop-color="#9c9ca0"/><stop offset="1" stop-color="#7d7d82"/></radialGradient></defs>
   <g class="disc">
    <circle cx="100" cy="100" r="98" fill="url(#g)"/>
    <g fill="none" stroke="#000" stroke-opacity=".13"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="42"/></g>
    <path d="M100 100V4A96 96 0 0 1 150 17z" fill="#fff" opacity=".16"/><path d="M100 100V196A96 96 0 0 1 50 183z" fill="#fff" opacity=".16"/>
    <circle cx="100" cy="100" r="32" fill="#ff7a00" stroke="#e05a00" stroke-width="2"/><circle cx="100" cy="100" r="4" fill="#111"/>
   </g>
   <g id="arm"><path d="M172 28L160 96L140 134" stroke="#cfcfd3" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="126" width="18" height="26" rx="4" fill="#2b2b2e" transform="rotate(25 140 134)"/><circle cx="172" cy="28" r="14" fill="#dcdce0" stroke="#b9b9be" stroke-width="2"/><circle cx="172" cy="28" r="5" fill="#8a8a8e"/></g>
  </svg>
 </div>
 <h2 class="tt c"></h2><p class="rr mu c"></p>
 <input type="range" id="sk" value="0" min="0" step="any" aria-label="التقدم">
 <div class="tm"><span id="t1">0:00</span><span id="t2">-0:00</span></div>
 <div class="ctl">
  <button id="sb" data-ic="moon" aria-label="مؤقت النوم"></button>
  <button id="pv" data-ic="prev" aria-label="السورة السابقة"></button>
  <button id="bk" aria-label="رجوع 10 ثوانٍ">−10</button>
  <button id="fw" aria-label="تقديم 10 ثوانٍ">+10</button>
  <button id="nx" data-ic="next" aria-label="السورة التالية"></button>
  <button id="spb">×1</button>
 </div>
 <div class="ctl2"><button id="mb2" aria-label="نص السورة">ق</button><span data-ic="vol" class="i2"></span><input type="range" id="vo" min="0" max="1" step=".01" aria-label="الصوت"></div>
</section>

<section class="sheet" id="ms"><div class="top"><button class="ib" data-close="ms" data-ic="x" aria-label="إغلاق"></button><b class="tt"></b><span class="ib"></span></div><div id="mb"></div></section>
<div id="bd"></div><section class="sheet" id="menu"></section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N='الفاتحة|البقرة|آل عمران|النساء|المائدة|الأنعام|الأعراف|الأنفال|التوبة|يونس|هود|يوسف|الرعد|إبراهيم|الحجر|النحل|الإسراء|الكهف|مريم|طه|الأنبياء|الحج|المؤمنون|النور|الفرقان|الشعراء|النمل|القصص|العنكبوت|الروم|لقمان|السجدة|الأحزاب|سبأ|فاطر|يس|الصافات|ص|الزمر|غافر|فصلت|الشورى|الزخرف|الدخان|الجاثية|الأحقاف|محمد|الفتح|الحجرات|ق|الذاريات|الطور|النجم|القمر|الرحمن|الواقعة|الحديد|المجادلة|الحشر|الممتحنة|الصف|الجمعة|المنافقون|التغابن|الطلاق|التحريم|الملك|القلم|الحاقة|المعارج|نوح|الجن|المزمل|المدثر|القيامة|الإنسان|المرسلات|النبأ|النازعات|عبس|التكوير|الانفطار|المطففين|الانشقاق|البروج|الطارق|الأعلى|الغاشية|الفجر|البلد|الشمس|الليل|الضحى|الشرح|التين|العلق|القدر|البينة|الزلزلة|العاديات|القارعة|التكاثر|العصر|الهمزة|الفيل|قريش|الماعون|الكوثر|الكافرون|النصر|المسد|الإخلاص|الفلق|الناس'.split('|');
const IC={list:'M4 6h16M4 12h16M4 18h10',users:'M15.5 8a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0zM4 21c0-3.6 3.6-5.5 8-5.5s8 1.9 8 5.5',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',disc:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM14.5 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z',moon:'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',prev:'M17 5v14M5 5l9 7-9 7z',next:'M7 5v14M19 5l-9 7 9 7z',x:'M6 6l12 12M18 6L6 18',vol:'M4 9v6h4l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
$$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};

let S={};try{S=JSON.parse(localStorage.getItem('q')||'{}')}catch(e){}
S.fr||=[];S.ft||=[];S.sp||=1;S.vol??=1;
const save=()=>{try{localStorage.setItem('q',JSON.stringify(S))}catch(e){}};
let R=[],cur={r:null,m:null,n:S.n||1},tab='home',MI=[];
const a=new Audio();a.preload='none';a.volume=S.vol;a.defaultPlaybackRate=a.playbackRate=S.sp;
$('#spb').textContent='×'+S.sp;$('#vo').value=S.vol;$('#vo').style.setProperty('--p',S.vol*100+'%');

const avail=()=>new Set(((cur.m&&cur.m.surah_list)||'').split(',').map(Number));
const key=()=>`${cur.r.id}|${cur.m.id}|${cur.n}`;
const url=n=>cur.m.server.replace(/\/?$/,'/')+String(n).padStart(3,'0')+'.mp3';

function setReciter(r,mid){if(!r)return;cur.r=r;cur.m=r.moshaf.find(m=>m.id==mid)||r.moshaf[0];S.r=r.id;S.m=cur.m.id;save();ui()}
function play(n){if(!cur.m)return;cur.n=n;S.n=n;save();a.src=url(n);a.defaultPlaybackRate=a.playbackRate=S.sp;a.play().catch(()=>{});ui()}
const tog=()=>{if(!cur.m)return;if(!a.src)play(cur.n);else a.paused?a.play():a.pause()};
function step(d){const av=[...avail()].sort((x,y)=>x-y).filter(x=>d>0?x>cur.n:x<cur.n);if(!av.length)return false;play(d>0?av[0]:av[av.length-1]);return true}

function ui(){
 if(!cur.r)return;
 const nm='سورة '+N[cur.n-1],rn=cur.r.name;
 $$('.tt').forEach(e=>e.textContent=nm);$$('.rr').forEach(e=>e.textContent=rn);
 $('#cr').innerHTML=`<b>${E(rn)}<small>${E(cur.m.name)}</small></b><span class="mu">تغيير</span>`;
 $('#fv').classList.toggle('on',S.ft.includes(key()));
 $('#mini').hidden=false;
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:nm,artist:rn,album:'القرآن الكريم',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}
 render();
}
function render(){({home,rec,fav})[tab]()}
function home(){
 const q=$('#q').value.trim(),av=avail();
 $('#sl').innerHTML=N.map((s,i)=>[i+1,s]).filter(([id,s])=>av.has(id)&&(!q||s.includes(q)||String(id)===q)).map(([id,s])=>`<div class="card row${cur.n==id?' cur':''}" data-n="${id}" tabindex="0"><span class="n">${id}</span><b>${s}</b></div>`).join('')||'<p class="mu c">لا توجد نتائج</p>';
}
function rec(){
 const q=$('#rq').value.trim();
 $('#rl').innerHTML=R.filter(r=>!q||r.name.includes(q)).map(r=>`<div class="card row${cur.r&&cur.r.id==r.id?' cur':''}" data-r="${r.id}" tabindex="0"><b>${E(r.name)}<small>${r.moshaf.length>1?r.moshaf.length+' روايات':E(r.moshaf[0].name)}</small></b><button class="ib fv${S.fr.includes(r.id)?' on':''}" data-fr="${r.id}" aria-label="مفضلة">${ic('star')}</button></div>`).join('')||'<p class="mu c">تعذر تحميل القراء. تحقق من الإنترنت ثم أعد فتح التطبيق.</p>';
}
function fav(){
 const fr=R.filter(r=>S.fr.includes(r.id));
 const ft=S.ft.map(k=>{const[r,m,n]=k.split('|'),x=R.find(y=>y.id==r);return x?`<div class="card row" data-ft="${k}" tabindex="0"><span class="n">${n}</span><b>سورة ${N[n-1]}<small>${E(x.name)}</small></b><button class="ib fv on" data-ftrm="${k}" aria-label="إزالة">${ic('star')}</button></div>`:''}).join('');
 $('#fl').innerHTML=(fr.length?'<h1>القراء المفضلون</h1>'+fr.map(r=>`<div class="card row" data-r="${r.id}" tabindex="0"><b>${E(r.name)}</b><button class="ib fv on" data-fr="${r.id}" aria-label="إزالة">${ic('star')}</button></div>`).join(''):'')+(ft?'<h1>التلاوات المفضلة</h1>'+ft:'')||'<p class="mu c" style="margin-top:40px">لا توجد مفضلة بعد.<br>اضغط النجمة على قارئ أو تلاوة لإضافتها.</p>';
}
function go(t){tab=t;$$('.v').forEach(v=>v.hidden=v.id!='v-'+t);$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==t));render();scrollTo(0,0)}
function menu(title,items){MI=items.map(x=>x[1]);$('#menu').innerHTML=`<h1>${title}</h1>`+items.map((x,i)=>`<button class="card row" style="width:100%;text-align:start" data-mi="${i}"><b>${x[0]}</b></button>`).join('');$('#menu').classList.add('open');$('#bd').classList.add('open')}
const closeMenu=()=>{$('#menu').classList.remove('open');$('#bd').classList.remove('open')};
function pickR(id){const r=R.find(x=>x.id==id);if(!r)return;
 if(r.moshaf.length>1)menu(E(r.name),r.moshaf.map(m=>[E(m.name),()=>{setReciter(r,m.id);go('home')}]));
 else{setReciter(r);go('home')}}

document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let t;
 if(t=g('[data-mi]')){const f=MI[t.dataset.mi];closeMenu();f&&f();return}
 if(g('#bd')){closeMenu();return}
 if(t=g('[data-fr]')){const i=+t.dataset.fr;S.fr=S.fr.includes(i)?S.fr.filter(x=>x!=i):[...S.fr,i];save();render();return}
 if(t=g('[data-ftrm]')){S.ft=S.ft.filter(x=>x!=t.dataset.ftrm);save();ui();return}
 if(t=g('[data-ft]')){const[r,m,n]=t.dataset.ft.split('|');setReciter(R.find(x=>x.id==r),m);play(+n);return}
 if(t=g('[data-r]')){pickR(t.dataset.r);return}
 if(t=g('[data-n]')){play(+t.dataset.n);return}
 if(t=g('[data-tab]')){t.dataset.tab=='player'?$('#pl').classList.add('open'):go(t.dataset.tab);return}
 if(t=g('[data-close]')){$('#'+t.dataset.close).classList.remove('open');return}
 if(g('#vw')||g('.pp')){tog();return}
 if(g('#mini .tx')){$('#pl').classList.add('open')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
$('#q').oninput=home;$('#rq').oninput=rec;

/* audio */
a.onplay=()=>document.body.classList.add('playing');
a.onpause=()=>document.body.classList.remove('playing');
function prog(){const d=isFinite(a.duration)?a.duration:0,c=a.currentTime||0;$('#sk').max=d;$('#sk').value=c;$('#sk').style.setProperty('--p',d?c/d*100+'%':'0%');$('#t1').textContent=fmt(c);$('#t2').textContent='-'+fmt(d-c)}
a.ontimeupdate=a.ondurationchange=prog;
a.onended=()=>{if(slEnd){sleep(0);return}step(1)};
$('#sk').oninput=e=>{a.currentTime=+e.target.value};
$('#vo').oninput=e=>{S.vol=+e.target.value;a.volume=S.vol;e.target.style.setProperty('--p',S.vol*100+'%');save()};
$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
$('#bk').onclick=()=>a.currentTime=Math.max(0,a.currentTime-10);
$('#fw').onclick=()=>a.currentTime=Math.min(a.duration||1e9,a.currentTime+10);
$('#fv').onclick=()=>{if(!cur.m)return;const k=key();S.ft=S.ft.includes(k)?S.ft.filter(x=>x!=k):[...S.ft,k];save();$('#fv').classList.toggle('on',S.ft.includes(k))};
$('#spb').onclick=()=>menu('سرعة التلاوة',[.75,1,1.25,1.5,2].map(v=>['×'+v,()=>{S.sp=v;a.defaultPlaybackRate=a.playbackRate=v;$('#spb').textContent='×'+v;save()}]));

/* sleep timer */
let sl=null,slEnd=false;
function sleep(m){clearTimeout(sl);slEnd=m==='end';$('#sb').classList.toggle('on',!!m);if(typeof m=='number'&&m)sl=setTimeout(fade,m*60000)}
function fade(){let v=a.volume;const i=setInterval(()=>{v-=.05;if(v<=.03){clearInterval(i);a.pause();a.volume=S.vol;sleep(0)}else a.volume=v},250)}
$('#sb').onclick=()=>menu('مؤقت النوم',[['١٥ دقيقة',15],['٣٠ دقيقة',30],['٤٥ دقيقة',45],['ساعة',60],['نهاية السورة','end'],['إيقاف المؤقت',0]].map(x=>[x[0],()=>sleep(x[1])]));

/* mushaf text */
$('#mb2').onclick=async()=>{
 $('#ms').classList.add('open');const b=$('#mb');b.textContent='جارٍ التحميل…';
 try{const j=await(await fetch(`https://api.alquran.cloud/v1/surah/${cur.n}/quran-uthmani`)).json();
  b.innerHTML=j.data.ayahs.map(x=>E(x.text)+' <i>﴿'+x.numberInSurah.toLocaleString('ar-EG')+'﴾</i>').join(' ')}
 catch(err){b.textContent='تعذر تحميل النص. يلزم الإنترنت في أول مرة.'}};

/* media session */
if('mediaSession' in navigator){const m=navigator.mediaSession,h=(k,f)=>{try{m.setActionHandler(k,f)}catch(e){}};
 h('play',()=>a.play());h('pause',()=>a.pause());h('previoustrack',()=>step(-1));h('nexttrack',()=>step(1));
 h('seekbackward',()=>a.currentTime-=10);h('seekforward',()=>a.currentTime+=10)}

/* install + sw */
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ins').hidden=false});
$('#ins').onclick=()=>{dp&&dp.prompt();$('#ins').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

/* boot */
(async()=>{
 try{R=(await(await fetch('https://mp3quran.net/api/v3/reciters?language=ar')).json()).reciters||[]}catch(e){R=[]}
 R=R.filter(r=>r.moshaf&&r.moshaf.length);
 const r=R.find(x=>x.id==S.r)||R.find(x=>x.name.includes('الحصري'))||R[0];
 if(r)setReciter(r,S.m);else rec();
})();
</script>
</body>
</html>
